[package]
name = "fast-cutvid"
version = "0.1.1"
edition = "2024"
description = "A fast, native, open-source non-linear video cutter"
license = "MIT"
repository = "https://github.com/modecir/fast-cutvid"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.32", features = ["persistence", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
uuid = { version = "1.17", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime"] }
objc2-core-video = { version = "0.3.2", features = ["CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSObject", "NSString", "NSURL", "NSValue", "std"] }

[profile.release]
lto = "thin"
strip = true
